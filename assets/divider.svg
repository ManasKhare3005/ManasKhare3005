<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" role="img" aria-label="divider">
<defs><linearGradient id="dg" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.2" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#f472b6"/><stop offset="0.8" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softglow" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<path id="dl" d="M0,20 L1200,20" stroke="url(#dg)" stroke-width="1.2" opacity="0.6"/>
<circle cx="60" cy="20" r="4" fill="#070b16" stroke="#22d3ee" stroke-width="1.5"><animate attributeName="r" values="3;5;3" dur="2s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="180" cy="20" r="4" fill="#070b16" stroke="#22d3ee" stroke-width="1.5"><animate attributeName="r" values="3;5;3" dur="2s" begin="0.2s" repeatCount="indefinite"/></circle><circle cx="300" cy="20" r="4" fill="#070b16" stroke="#22d3ee" stroke-width="1.5"><animate attributeName="r" values="3;5;3" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle><circle cx="420" cy="20" r="4" fill="#070b16" stroke="#22d3ee" stroke-width="1.5"><animate attributeName="r" values="3;5;3" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle><circle cx="540" cy="20" r="4" fill="#070b16" stroke="#22d3ee" stroke-width="1.5"><animate attributeName="r" values="3;5;3" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle><circle cx="660" cy="20" r="4" fill="#070b16" stroke="#a78bfa" stroke-width="1.5"><animate attributeName="r" values="3;5;3" dur="2s" begin="1.0s" repeatCount="indefinite"/></circle><circle cx="780" cy="20" r="4" fill="#070b16" stroke="#a78bfa" stroke-width="1.5"><animate attributeName="r" values="3;5;3" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle><circle cx="900" cy="20" r="4" fill="#070b16" stroke="#a78bfa" stroke-width="1.5"><animate attributeName="r" values="3;5;3" dur="2s" begin="1.4s" repeatCount="indefinite"/></circle><circle cx="1020" cy="20" r="4" fill="#070b16" stroke="#a78bfa" stroke-width="1.5"><animate attributeName="r" values="3;5;3" dur="2s" begin="1.6s" repeatCount="indefinite"/></circle><circle cx="1140" cy="20" r="4" fill="#070b16" stroke="#a78bfa" stroke-width="1.5"><animate attributeName="r" values="3;5;3" dur="2s" begin="1.8s" repeatCount="indefinite"/></circle>
<circle r="3.5" fill="#f472b6" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#dl"/></animateMotion></circle>
<circle r="2.5" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="5s" begin="2.5s" repeatCount="indefinite"><mpath href="#dl"/></animateMotion></circle>
</svg>